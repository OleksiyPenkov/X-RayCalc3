<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="#0a1a2e" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8E6F2"/>
      <stop offset="100%" stop-color="#B4C8DC"/>
    </linearGradient>
    <linearGradient id="tabG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0D0E2"/>
      <stop offset="100%" stop-color="#96AABE"/>
    </linearGradient>
  </defs>
  <!-- the Open Project folder, carrying a measured curve instead of a document's lines -->
  <g stroke-linecap="round" stroke-linejoin="round" filter="url(#sh)">
    <rect x="4" y="15" width="32" height="20" rx="2" fill="url(#bodyG)" stroke="#19375F" stroke-width="2"/>
    <path d="M4 17v-5a2 2 0 0 1 2-2h10l3 5z" fill="url(#tabG)" stroke="#19375F" stroke-width="2"/>
  </g>
  <!-- a reflectivity curve: plateau, fall, two fringes -->
  <path d="M8 21 h5 c2 0 3 4 4.5 6 s2.5 2 4 0 s3-3 4.5-1.5 s3 1.5 6 1"
        fill="none" stroke="#3CB4DC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
